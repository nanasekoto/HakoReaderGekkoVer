name: Build Hako Pocket APK (Gecko)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build ARM32 Release APK
      run: gradle assembleRelease -Pabi=armeabi-v7a --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hako-Pocket-0.7.1-Gecko-arm32
        path: "app/build/outputs/apk/release/app-release.apk"
